spark.master                     spark://localhost:7077
spark.app.name                   KGFixer
spark.executor.cores             3
spark.cores.max                  21
spark.executor.memory            31g
spark.driver.memory              5g
spark.default.parallelism        21
spark.sql.shuffle.partitions     42
spark.network.timeout            600s
spark.executor.memoryOverhead    3g
spark.executor.heartbeatInterval 120s
spark.executor.extraJavaOptions  -XX:+UseG1GC -Xlog:gc*:file=/tmp/gc-logs/gc-executor.log:tags,time,uptime,level -XX:MaxGCPauseMillis=100 -XX:InitiatingHeapOccupancyPercent=20
spark.driver.extraJavaOptions    -XX:+UseG1GC -Xlog:gc*:file=/tmp/gc-logs/gc-driver.log:tags,time,uptime,level -XX:MaxGCPauseMillis=100 -XX:InitiatingHeapOccupancyPercent=20
